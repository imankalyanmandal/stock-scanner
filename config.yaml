# Stock scanner configuration. Every threshold from the design list lives here.

universe:
  # Keys map to NSE constituent CSVs (see scanner/universe.py)
  indexes: [nifty50, niftynext50, niftymidcap150]

schedule:
  timezone: Asia/Kolkata
  hour: 3
  minute: 0
  # Tue-Sat at 3 AM scans the previous day's Mon-Fri session.
  # Use "*" to run literally every day (Sun/Mon runs would re-scan Friday).
  day_of_week: tue-sat

market:
  benchmarks:
    nifty50: "^NSEI"
    nifty500: "^CRSLDX"
  breadth_strong_pct: 60      # % of universe above 20 DMA for a "strong" market
  breadth_weak_pct: 40        # below this = "weak"
  sector_weak_pct: 40         # sector breadth below this -> stock flagged weak_sector
  weak_market_action: tighten # tighten | skip
  tighten_min_score_add: 10   # added to min_score in a weak market

gates:                        # hard rejects
  min_price: 50
  min_median_turnover_cr: 10  # 20-day MEDIAN turnover, in crore
  min_avg_volume: 100000      # 20-day average shares traded
  green_mode: prev_close      # prev_close | candle | both
  green_days: 2
  max_2day_gain_pct: 8
  rsi_hard_max: 75
  max_extension_atr: 2.0      # (close - 20 DMA) / ATR
  min_reward_risk: 2.0
  max_stop_atr: 3.0           # stop further than this many ATRs = reject
  reject_no_setup: false      # true = drop stocks that are neither breakout nor pullback

risk:                         # how entry/stop/target are estimated
  resistance_pivot_window: 10 # a swing high must be the top of +/-10 bars to count as resistance
  blue_sky_target_atr: 4.0    # target when no overhead resistance (fresh highs)

scoring:
  volume_ratio_target: 1.5
  close_location_min: 0.70    # close in top 30% of day's range
  delivery_min_pct: 40
  rsi_band: [50, 70]
  high_atr_pct: 5.0           # ATR above this % of price -> high_volatility flag
  gap_flag_pct: 4.0
  min_score: 55
  weights:                    # should sum to 100
    volume: 15
    close_location: 10
    delivery: 10
    structure: 10
    trend: 15
    rsi: 10
    rel_strength: 20
    reward_risk: 10

events:
  lookahead_days: 5

news:
  enabled: true
  lookback_days: 3
  fresh_hours: 48
  max_items: 5

notify:
  telegram:
    enabled: true             # also needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID env vars
    max_picks: 15             # picks listed in the message
    send_report_file: true    # attach the full HTML report

output:
  dir: reports
  log_dir: logs
  data_dir: data
