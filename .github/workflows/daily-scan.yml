name: Daily stock scan

on:
  schedule:
    # 21:30 UTC Mon-Fri = 3:00 AM IST Tue-Sat (scans the previous trading session)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write         # needed to commit reports back to the repo

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run scan and send Telegram summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python run_scan.py

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30

      - name: Commit report and cached constituents
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898294+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "Scan report $(date -u +%F)"
          git pull --rebase origin main
          git push
