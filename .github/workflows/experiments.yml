name: Experiments

on:
  workflow_dispatch: {}

permissions:
  contents: write         # commits the experiments report to reports/

concurrency:
  group: repo-commits     # don't race the daily scan's commit
  cancel-in-progress: false

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run experiments
        run: |
          python experiments.py
          cat reports/experiments_*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898294+github-actions[bot]@users.noreply.github.com"
          git add reports/experiments_*
          git diff --cached --quiet || git commit -m "Experiments report $(date -u +%F)"
          git pull --rebase origin main
          git push
