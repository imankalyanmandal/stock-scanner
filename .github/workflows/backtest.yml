name: Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD, optional)"
        required: false
      end:
        description: "End date (YYYY-MM-DD, optional)"
        required: false

permissions:
  contents: write         # commits the backtest report to reports/

concurrency:
  group: repo-commits     # don't race the daily scan's commit
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: |
          ARGS=""
          [ -n "${{ inputs.start }}" ] && ARGS="$ARGS --start ${{ inputs.start }}"
          [ -n "${{ inputs.end }}" ] && ARGS="$ARGS --end ${{ inputs.end }}"
          python backtest.py $ARGS | tee backtest_output.txt
          { echo '## Backtest result'; echo '```'; sed -n '/^Backtest /,$p' backtest_output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_number }}
          path: reports/backtest_*
          retention-days: 30
      - name: Commit backtest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898294+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest_*
          git diff --cached --quiet || git commit -m "Backtest report $(date -u +%F)"
          git pull --rebase origin main
          git push
