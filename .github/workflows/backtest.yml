name: Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD, optional)"
        required: false
      end:
        description: "End date (YYYY-MM-DD, optional)"
        required: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: |
          ARGS=""
          [ -n "${{ inputs.start }}" ] && ARGS="$ARGS --start ${{ inputs.start }}"
          [ -n "${{ inputs.end }}" ] && ARGS="$ARGS --end ${{ inputs.end }}"
          python backtest.py $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_number }}
          path: reports/backtest_*
          retention-days: 30
