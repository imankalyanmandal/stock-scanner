name: Holdings news

on:
  schedule:
    - cron: "5 2 * * 1-6"     # 7:35 AM IST Mon-Sat: overnight news and results, before the open
    - cron: "35 12 * * 1-5"   # 6:05 PM IST Mon-Fri: after-market results and filings
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  holdings-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check news on holdings and send the digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python holdings_news.py
      - name: Commit sent-news memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898294+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Holdings news $(date -u +%F)"
          git pull --rebase origin main
          git push
