name: Setup check

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Telegram (prints only whether secrets exist and the API's answer)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scanner.notify reports/telegram_check.json
      - name: Check news sources and LLM keys (prints only status, never keys)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m scanner.news reports/news_check.json
      - name: Check global risk assessment (prints only status, never keys)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m scanner.macro reports/macro_check.json
      - name: Check price data freshness (Yahoo)
        run: python -m scanner.data reports/data_check.json
      - name: Check quarterly results sources (NSE, Yahoo)
        run: python -m scanner.results_probe reports/results_check.json
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898294+github-actions[bot]@users.noreply.github.com"
          git add -A reports data
          git diff --cached --quiet || git commit -m "Setup check $(date -u +%F)"
          git pull --rebase origin main
          git push
