name: Pre-market news check

on:
  schedule:
    # 02:50 UTC Mon-Fri = 8:20 AM IST. GitHub may start scheduled jobs late, so this aims
    # to finish before the 9:15 open even with a delay.
    - cron: "20 2 * * 1-5"    # 7:50 AM IST
    - cron: "50 2 * * 1-5"    # 8:20 AM IST (backup; skipped if the first already ran)
    - cron: "25 3 * * 1-5"    # 8:55 AM IST (last chance; stands down after 9:20)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recheck news for today's picks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python premarket.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898294+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Pre-market check $(date -u +%F)"
          git pull --rebase origin main
          git push
