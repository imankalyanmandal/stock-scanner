name: NSE MCP probe

# Lists every tool on NSE's MCP servers with a sample response and commits the result to
# reports/mcp_probe.json on the branch it ran from. Run it if NSE changes its tools.
on:
  workflow_dispatch:      # manual only: Actions tab -> NSE MCP probe -> Run workflow

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scanner.nse_mcp reports/mcp_probe.json
      - run: python -m scanner.nse_mcp_probe2 reports/mcp_probe2.json
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898294+github-actions[bot]@users.noreply.github.com"
          git add reports/mcp_probe*.json
          git diff --cached --quiet || git commit -m "NSE MCP probe $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
