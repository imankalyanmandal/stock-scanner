# Variants compared by `python experiments.py` (and the Experiments workflow).
# Each variant is a set of overrides deep-merged into config.yaml. {} = config.yaml as is.

period: 10y                   # longer than the daily backtest to get more trades

breakout_variants:
  B_baseline_live: {}
  D_momentum_top40:
    rs: {momentum_top_n: 40}
  I1_macd_bullish:
    indicators: {require_macd_bullish: true}
  I2_supertrend_up:
    indicators: {require_supertrend_up: true}
  I3_adx_20:
    indicators: {min_adx: 20}
  I4_adx_25:
    indicators: {min_adx: 25}
  I5_bb_squeeze:
    indicators: {require_bb_squeeze: true}
  I6_all_four:
    indicators: {require_macd_bullish: true, require_supertrend_up: true, min_adx: 20,
                 require_bb_squeeze: true}
  I7_top40_plus_squeeze:
    rs: {momentum_top_n: 40}
    indicators: {require_bb_squeeze: true}

momentum_variants:
  M2_top30_200dma_filter: {}
